name: Acceptance
on:
  pull_request:
    branches:
      - main
      - release*
      - staging
      - refactor/library-enablement
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install

      - name: Lint Codebase
        run: pnpm run lint

      # Fails on NEW "current version" style statements in hand-written docs.
      # Accepted existing cases are in scripts/version-claims-baseline.json.
      - name: Check for version claims
        run: pnpm run check:version-claims
  test:
    runs-on: ubuntu-latest
    needs:
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Run Tests
        run: pnpm test
  build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install D2
        run: curl -fsSL https://d2lang.com/install.sh | sh

      - name: Install Dependencies
        run: pnpm install

      - name: Run Build
        run: pnpm run build
        env:
          PUBLIC_GTM_ID: ${{ secrets.PUBLIC_GTM_ID }}
